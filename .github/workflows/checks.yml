name: checks
# Hosted CI: cheap drafts, fast PR checks, full merge-queue/main/manual/nightly gate.
# Security scans always run, including docs-only changes. No secrets.
#
# Path-aware PRs and merge queue: tools/ci/paths.py classifies the files a ready PR changes
# (base...head) or a queued group changes (merge_group.base_sha..head_sha). Every queued tree
# additionally runs the complete oxa workspace, including tests that read docs/assets. Outputs: engine/ and fuzz/oxe/ -> `engine` (clippy, x86_64 stub server tests,
# the x86_64 engine workspace check, ARM engine and Flash builds, oxe fuzz smoke); oxa/ and
# fuzz/oxa/ -> `oxa` (clippy, the oxa test archive and shards, the ARM oxa build, oxa fuzz smoke);
# oxc/ -> `gateway`; oxa/oxc-gateway/ -> `gateway`.
# The shared gateway selects oxa to check its in-process consumer.
# Anything else (.github/, tools/, packaging/, root files, a new directory) and an empty group
# diff count as "everything changed".
# A push on main, the nightly run and manual runs set every output, so main runs everything after
# each merge (one run at a time; a newer push replaces a waiting one) and catches cross-component
# breaks outside the components selected by a PR. Drafts run only the classifier, the scans
# and rustfmt. The scans run on every event and every change, unconditionally.
# The `gate` job aggregates every job below; it fails when any job failed or was cancelled, when
# the classifier or the scans did not succeed, or when a classifier output is not literally
# 'true'/'false', so a skip caused by a failed or missing classifier cannot pass.
#
# Caches: jobs only restore; only main (push, nightly, manual) saves, once per dependency-level key
# prefix (compiler, flags, Cargo.toml, Cargo.lock) as `<prefix>main`. Caches saved on PR or queue
# refs are visible only there, so saving them would only evict main's shared caches.
on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  workflow_dispatch:
    inputs:
      nightly_oxa_arm:
        description: Also run the nightly native ARM64 oxa workspace gate
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_VERSION: "1.99.1"

# Runner choice for the x86_64 jobs (the expression in each `runs-on`): the project's own runners (label `oxci` for the merge queue,
# main and manual runs; label `oxci-pr`, a separate low-priority pool, for pull requests; a rented
# throwaway server with no secrets) when the repository variable OXCI is 'on'. Pull-request runs use it only when
# OXCI_PR is also 'on' AND the pull request comes from a branch of this repository; a pull request from a fork always
# runs on the hosted image, so outside code never reaches the runner. Any other value of OXCI sends every job back
# to the hosted images (kill switch). The ARM jobs are always hosted.
jobs:
  changes:
    name: classify changed paths
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      full: ${{ steps.paths.outputs.full }}
      docs: ${{ steps.paths.outputs.docs }}
      engine: ${{ steps.paths.outputs.engine }}
      oxa: ${{ steps.paths.outputs.oxa }}
      gateway: ${{ steps.paths.outputs.gateway }}
      md: ${{ steps.paths.outputs.md }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        run: python3 -I tools/ci/paths.py
      - name: Path filter controls
        run: python3 -I -m unittest discover -s tools/ci/tests

  links:
    name: documentation links
    needs: changes
    if: (needs.changes.outputs.full == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.md == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 tools/ci/links.py

  build:
    # Always call the reusable workflow so each required child check reports, even when skipped.
    # oxe-server, oxi, the Flash variant and oxa: build and model-free tests on ARM64 (build.yml)
    # Ready PRs select changed components. The queue always runs the complete oxa workspace;
    # the classifier sets every component on main, nightly and manual runs.
    needs: changes
    uses: ./.github/workflows/build.yml
    with:
      version: dev-${{ github.sha }}
      package: false
      heavy: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
      build_oxa: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
      engine: ${{ needs.changes.outputs.engine == 'true' }}
      oxa: ${{ github.event_name == 'merge_group' || needs.changes.outputs.oxa == 'true' }}

  oxa-nightly-arm:
    # Extra primary-platform coverage at night; manual opt-in validates this job before merge.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly_oxa_arm)
    name: oxa nightly tests (aarch64; bwrap required)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bubblewrap + unprivileged user namespaces
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap strace
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind / / true
      - name: Toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - name: Compiler and source cache key
        id: rust-key
        run: python3 -I tools/ci/rust_cache_key.py --variant ubuntu24-arm-oxa-ci oxa
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            oxa/target
          key: ${{ steps.rust-key.outputs.key }}
          restore-keys: ${{ steps.rust-key.outputs.prefix }}
      - name: Rust cache result
        run: echo "Rust cache exact hit = ${{ steps.rust-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Pinned nextest
        run: tools/ci/install_nextest.sh "$RUNNER_TEMP/nextest"
      - name: Whole ARM64 workspace, isolated HOME and mandatory bwrap
        run: tools/ci/run_oxa_nightly.sh "$RUNNER_TEMP/oxa-arm-nightly"
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        # Only main seeds caches: queue and PR refs cannot share theirs (see the header).
        if: github.ref == 'refs/heads/main' && github.event_name != 'merge_group' && steps.rust-cache.outputs.cache-matched-key != format('{0}main', steps.rust-key.outputs.prefix)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            oxa/target
          key: ${{ steps.rust-key.outputs.prefix }}main
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: oxa-nightly-arm-reports
          path: |
            ${{ runner.temp }}/oxa-arm-nightly
            oxa/target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 7

  rustfmt:
    name: rustfmt (oxa)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rustup is preinstalled on the hosted image)
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --no-self-update
      - name: oxa
        working-directory: oxa
        run: cargo fmt --all -- --check
      - name: engine
        working-directory: engine
        run: cargo fmt --all -- --check

  clippy:
    needs: changes
    if: (needs.changes.outputs.engine == 'true' || needs.changes.outputs.oxa == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # Compile errors fail the job; lint warnings are reported but do not fail it yet. Add
    # "-- -D warnings" once the warning count is known to be zero.
    name: clippy (engine, oxa; aarch64)
    runs-on: ubuntu-24.04-arm
    container:
      image: fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: engine/tools/ci/setup_toolchain.sh "$RUST_VERSION" clippy
      - name: Compiler and source cache key
        id: rust-key
        working-directory: ${{ github.workspace }}
        run: python3 -I tools/ci/rust_cache_key.py --variant fedora44-clippy engine oxa
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
            oxa/target
          key: ${{ steps.rust-key.outputs.key }}
          restore-keys: ${{ steps.rust-key.outputs.prefix }}
      - name: Mark sources newer than any restored build output
        # A restored target/ may hold workspace crates built from OLDER sources. Checkout mtimes can be older
        # than those artifacts, so cargo would treat stale crates as fresh. Touching the tracked sources
        # forces workspace crates to rebuild; third-party dependencies stay cached.
        working-directory: ${{ github.workspace }}
        run: find engine oxa -path '*/target' -prune -o -type f -exec touch -c {} +
      - name: Rust cache result
        run: echo "Rust cache exact hit = ${{ steps.rust-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
      - name: engine (model-free workspace, all targets)
        if: needs.changes.outputs.engine == 'true'
        working-directory: engine
        run: cargo clippy --locked --workspace --exclude qwen4exp --all-targets
      - name: oxa (all targets)
        if: needs.changes.outputs.oxa == 'true'
        working-directory: oxa
        run: cargo clippy --locked --workspace --all-targets
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        # Only main seeds caches: queue and PR refs cannot share theirs (see the header).
        if: github.ref == 'refs/heads/main' && github.event_name != 'merge_group' && steps.rust-cache.outputs.cache-matched-key != format('{0}main', steps.rust-key.outputs.prefix)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
            oxa/target
          key: ${{ steps.rust-key.outputs.prefix }}main

  x86-64-stub:
    needs: changes
    # engine changes run the server tests and the OpenAI contract
    if: needs.changes.outputs.engine == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # oxe-server builds on x86_64 with the stub engine only (kernels-sys compiles its kernels on
    # aarch64 only; the model engine refuses to load elsewhere). Its server tests that do not need
    # the model engine run here. Uses the hosted image's rustup (setup_toolchain.sh installs the
    # aarch64 rustup binary only).
    name: oxe-server --engine stub on x86_64 (build + server tests)
    runs-on: ${{ vars.OXCI == 'on' && (github.event_name != 'pull_request' && 'oxci' || (vars.OXCI_PR == 'on' && github.event.pull_request.head.repo.full_name == github.repository) && 'oxci-pr') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rustup is preinstalled on the hosted image)
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - name: Compiler and source cache key
        id: rust-key
        working-directory: ${{ github.workspace }}
        run: python3 -I tools/ci/rust_cache_key.py --variant ubuntu24-x86-stub engine
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ steps.rust-key.outputs.key }}
          restore-keys: ${{ steps.rust-key.outputs.prefix }}
      - name: Mark sources newer than any restored build output
        # A restored target/ may hold workspace crates built from OLDER sources. Checkout mtimes can be older
        # than those artifacts, so cargo would treat stale crates as fresh. Touching the tracked sources
        # forces workspace crates to rebuild; third-party dependencies stay cached.
        working-directory: ${{ github.workspace }}
        run: find engine oxa -path '*/target' -prune -o -type f -exec touch -c {} +
      - name: Rust cache result
        run: echo "Rust cache exact hit = ${{ steps.rust-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ hashFiles('tools/openai-contract/requirements.txt') }}
      - name: Build oxe-server
        working-directory: engine
        run: cargo build --release --locked -p server --bin oxe-server
      - name: Smoke (stub engine; the model engine refuses cleanly)
        working-directory: engine
        run: ./target/release/oxe-server --help > help.txt && head -n 3 help.txt
      - name: Server tests (stub engine; model-engine tests are aarch64-only)
        if: needs.changes.outputs.engine == 'true'
        working-directory: engine
        timeout-minutes: 30
        run: |
          ulimit -c 0  # no core dumps from the deliberate-abort tests (tests::panic_child)
          cargo test --release --locked -p server --lib

      - name: OpenAI contract (engine over loopback)
        working-directory: ${{ github.workspace }}
        run: |
          root=$(mktemp -d)
          mkdir -p "$root/home"
          env -i PATH="$PATH" HOME="$root/home" PIP_CACHE_DIR="$HOME/.cache/pip" \
            tools/openai-contract/run.sh --mode engine --server "$PWD/engine/target/release/oxe-server" --work "$root/work"
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        # Only main seeds caches: queue and PR refs cannot share theirs (see the header).
        if: github.ref == 'refs/heads/main' && github.event_name != 'merge_group' && steps.rust-cache.outputs.cache-matched-key != format('{0}main', steps.rust-key.outputs.prefix)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ steps.rust-key.outputs.prefix }}main
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        # Only main seeds caches: queue and PR refs cannot share theirs (see the header).
        if: github.ref == 'refs/heads/main' && github.event_name != 'merge_group' && steps.pip-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ hashFiles('tools/openai-contract/requirements.txt') }}

  engine-x86-workspace:
    needs: changes
    if: needs.changes.outputs.engine == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # O394/O395 (#912, engine N1): the engine workspace as seen from a non-aarch64 target. int8-gemm
    # and qwen4exp used to enter their ARM C builds unconditionally (-march=armv8.6-a, -mcpu=oryon-1,
    # a pre-existing production ggml archive), so nothing could check the workspace off aarch64. Both
    # build scripts now return before any compiler or archive access and their kernel entry points
    # refuse instead of returning fabricated results. Verify on GitHub-hosted x86_64 with an
    # isolated HOME/XDG.
    name: engine workspace check, non-aarch64 (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "4"
    steps:
      # The isolated HOME must exist before any step that uses it (git included).
      - name: Isolated HOME and XDG
        run: |
          ci_home="${RUNNER_TEMP:?}/home"
          mkdir -p "$ci_home"/{.cargo,.rustup,.cache,.config,.local/share}
          {
            printf 'HOME=%s\n' "$ci_home"
            printf 'CARGO_HOME=%s/.cargo\n' "$ci_home"
            printf 'RUSTUP_HOME=%s/.rustup\n' "$ci_home"
            printf 'XDG_CACHE_HOME=%s/.cache\n' "$ci_home"
            printf 'XDG_CONFIG_HOME=%s/.config\n' "$ci_home"
            printf 'XDG_DATA_HOME=%s/.local/share\n' "$ci_home"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          {
            echo "target: $(uname -m)-$(uname -s) $(uname -r)"
            rustc -vV
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Prior non-aarch64 failure (what the guards skip)
        working-directory: engine
        # The first two lines reproduce, without the guard, the two ways the old build scripts failed
        # off aarch64: the host compiler refuses the ARM -march=armv8.6-a flags, and there is no
        # production ggml archive in an isolated HOME for qwen4exp to find (its build script panicked).
        run: |
          if cc -march=armv8.6-a+dotprod+i8mm+fp16+nosve+nosme -O3 -DNDEBUG -std=gnu11 \
                -c crates/int8-gemm/csrc/i8g_kernels.c -o /dev/null 2> cc.err; then
            echo "::error::the x86_64 compiler accepted an ARM -march=armv8.6-a"
            exit 1
          fi
          head -n 3 cc.err | sed 's/^/cc: /'
          rm -f cc.err
          test ! -e "$HOME/.cache/local-ai/snapdragon-engine/ggml-prod/lib/libggml-cpu.a"
          echo "prior failure reproduced: ARM -march rejected by the host compiler, production ggml archive absent" >> "$GITHUB_STEP_SUMMARY"
      - name: cargo check --workspace (no kernel is compiled)
        working-directory: engine
        # Compiled C is absent by design on this target: kernels-sys, int8-gemm and qwen4exp return
        # from their build scripts before cc, ld, objcopy or ar. Everything else is target-neutral
        # Rust, including the crates that link int8-gemm (image-dit, image-flow, image-vae).
        run: |
          cargo check --locked --workspace
          echo "engine workspace check (x86_64): ok" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Unsupported kernel entry points refuse (model-free negative control)
        working-directory: engine
        # Every raw entry point of int8-gemm (the GEMM tiles, the sink kernels and the float attention
        # kernels) must refuse on this target: the test calls each one with null pointers, which the
        # stub never dereferences, and requires the refusal message. No model, no device, no fixture.
        run: |
          cargo test --locked -p int8-gemm --lib -- unsupported_target_refuses_every_entry_point
      - name: Apple aarch64 is still a documented blocker
        # An architecture guard alone does not prove Apple aarch64 compatibility: the kernel builds
        # need GCC-16/fedora flags (-mcpu=oryon-1), the vendored ggml build's Linux assumptions and
        # qwen4exp's io_uring. Recorded here so a green x86_64 check is not read as a green macOS one.
        run: |
          {
            echo "Outstanding Apple aarch64 blockers (unchanged by this job):"
            echo "- -mcpu=oryon-1 and the vendored ggml/Flash C builds assume Linux aarch64 GCC;"
            echo "- qwen4exp uses io_uring through raw Linux syscalls;"
            echo "- production flags/numerics are unchanged and need the maintained hardware batch."
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz-oxa:
    # Task 61: the stable smoke of the oxa cargo-fuzz targets (seconds; no nightly/sanitizer).
    name: oxa fuzz smoke (x86_64)
    needs: changes
    if: needs.changes.outputs.oxa == 'true'
    runs-on: ${{ vars.OXCI == 'on' && (github.event_name != 'pull_request' && 'oxci' || (vars.OXCI_PR == 'on' && github.event.pull_request.head.repo.full_name == github.repository) && 'oxci-pr') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rustup is preinstalled on the hosted image)
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - name: Task 61 oxa targets, short smoke
        run: cargo test --locked --manifest-path fuzz/oxa/Cargo.toml --test smoke

  fuzz-oxe:
    # Task 61: the stable smoke of the oxe cargo-fuzz targets (seconds; no model weights).
    name: oxe fuzz smoke (x86_64)
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ${{ vars.OXCI == 'on' && (github.event_name != 'pull_request' && 'oxci' || (vars.OXCI_PR == 'on' && github.event.pull_request.head.repo.full_name == github.repository) && 'oxci-pr') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rustup is preinstalled on the hosted image)
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - name: Task 61 oxe targets, short smoke
        run: cargo test --locked --manifest-path fuzz/oxe/Cargo.toml --test smoke

  scans:
    name: secret scan, SDK-material check, product isolation
    # Never path-gated: runs on every event and every change.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Secret scan (tracked files)
        run: |
          pat='(ghp_[A-Za-z0-9]{30,}|gho_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|hf_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9_-]{32,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
          # exclusions: synthetic fixtures; the report-issue scrubber test, whose INPUTS are fake key-shaped
          # strings it asserts are removed (exact file, reviewed 2026-11-14; same entry in sanitize-scan.allow)
          # Plan item 22: exact test-only fixture of obviously fake OpenAI key/JWT/refresh
          # shapes; asserts configured secrets disappear from errors and echoed headers.
          # No real credentials or requests. Keep realistic inputs intact (T3 review).
          if git grep -nIE "$pat" -- . ':!oxa/oxa-cli/tests/o152_report_issue_and_identity.rs' ':!oxa/oxc-gateway/tests/redaction_openai.rs'; then echo "secret-like strings found"; exit 1; fi
          echo "no secret-like strings in $(git ls-files | wc -l) tracked files"
      - name: SDK-material check (file names, ELF objects, hexagon directories)
        # Self-contained: the exporter's full scan (text notices included) runs at export time.
        # Headers, IDL, stubs, skeletons, shared objects and ELF objects are refused everywhere.
        run: |
          python3 -I - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('.').resolve(); bad = []
          name_rx = re.compile(r'^(HAP_.*\.h|qurt.*\.h|dspqueue\.h|remote(?:64)?\.h|AEEStd.*\.h|AEEatomic\.h|rpcmem\.h|adsprpc.*\.h|hexagon_.*\.h|hvx_hexagon_protos\.h|.*\.idl|.*skel.*\.so.*|.*\.so(\..*)?|.*_stub\.c|.*_skel\.c)$', re.I)
          for d in root.rglob('*'):
              rel = d.relative_to(root)
              if '.git' in rel.parts:
                  continue
              if d.is_dir() and d.name == 'ggml-hexagon':
                  bad.append(f'{rel}/ (directory)')
              if d.is_file():
                  if name_rx.match(d.name):
                      bad.append(str(rel))
                  elif d.stat().st_size > 52:
                      with d.open('rb') as fh:
                          if fh.read(4) == b'\x7fELF':
                              bad.append(f'{rel} (ELF object)')
          print('\n'.join(sorted(bad)) or 'no SDK-like files'); sys.exit(1 if bad else 0)
          PY
      - name: Product isolation (engine and oxa are separate workspaces)
        run: |
          python3 -I - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('.').resolve(); bad = []
          for prod in ('engine', 'oxa'):
              for toml in (root / prod).rglob('Cargo.toml'):
                  if 'target' in toml.parts:
                      continue
                  for m in re.finditer(r'path\s*=\s*"([^"]+)"', toml.read_text()):
                      dest = (toml.parent / m.group(1)).resolve()
                      if not dest.is_relative_to(root / prod):
                          bad.append(f'{toml.relative_to(root)}: path = "{m.group(1)}" leaves {prod}/')
          for name in ('Cargo.toml', 'Cargo.lock'):
              if (root / name).exists():
                  bad.append(f'{name} at the root: engine/ and oxa/ are separate workspaces')
          print('\n'.join(bad) or 'isolation ok'); sys.exit(1 if bad else 0)
          PY

      - name: Receipt scrub check (benchmarks/, experiments/)
        working-directory: oxc
        # --user '': the user-name rule matches the account that RUNS the scrub (the maintainer's,
        # when receipts are scrubbed locally). Here that is the hosted runner's account, `runner`,
        # which only matches the English word "runner" in receipts. The other rules still run.
        run: git ls-files -z benchmarks experiments | xargs -0 -r timeout 300 python3 -I tools/scrub_receipts.py --check --user ''

  gateway:
    # Moved from cloud-gateway.yml (fmt + conformance, same steps and matrix) so the gate covers it.
    needs: changes
    if: (needs.changes.outputs.gateway == 'true' || (github.event_name == 'merge_group' && needs.changes.outputs.oxa == 'true')) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: cloud gateway (${{ matrix.runner }})
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    # x86_64 uses the shared runner expression; ARM stays hosted.
    runs-on: ${{ matrix.runner == 'ubuntu-latest' && (vars.OXCI == 'on' && (github.event_name != 'pull_request' && 'oxci' || (vars.OXCI_PR == 'on' && github.event.pull_request.head.repo.full_name == github.repository) && 'oxci-pr') || 'ubuntu-24.04') || matrix.runner }}
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap strace
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt --no-self-update
      - name: Fetch locked workspace dependencies before offline tests
        run: cargo fetch --locked --manifest-path oxa/Cargo.toml
      - run: cargo fmt --manifest-path oxa/Cargo.toml --all -- --check
      - run: cargo check --locked --manifest-path oxa/Cargo.toml -p oxc-gateway --no-default-features
      - run: cargo check --locked --manifest-path oxa/Cargo.toml -p oxa-engine --no-default-features
      - run: cargo clippy --locked --manifest-path oxa/Cargo.toml -p oxc-gateway --all-targets --all-features -p oxa-engine -- -D warnings
      - name: Rust gateway tests with isolated environment
        run: |
          gateway_test_home=$(mktemp -d)
          # Valid synthetic JSON with another owner exercises the owner guard
          # before the mode/content guards. Its parent remains private (0700).
          gateway_owner_fixture="$gateway_test_home/foreign.json"
          printf '%s\n' '{"anthropic":"synthetic-foreign-credential"}' > "$gateway_owner_fixture"
          sudo chown 65534:65534 "$gateway_owner_fixture"
          sudo chmod 0644 "$gateway_owner_fixture"
          gateway_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          gateway_rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          bwrap --unshare-user --unshare-net --cap-drop ALL --die-with-parent --new-session --bind / / --proc /proc --dev /dev -- \
            env -i PATH="$PATH" HOME="$gateway_test_home" OXC_SECRET_OWNER_PATH="$gateway_owner_fixture" CARGO_HOME="$gateway_cargo_home" RUSTUP_HOME="$gateway_rustup_home" RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" \
            bash -ec '
              cargo test --locked --offline --manifest-path oxa/Cargo.toml -p oxc-gateway --all-features -p oxa-engine --profile ci
              cargo test --locked --offline --manifest-path oxa/Cargo.toml -p oxa-cli --test in_process_cloud --test in_process_openai --profile ci
            '

  gate:
    # The one aggregate check: every job in `needs` must succeed or be skipped; the classifier and
    # the scans must succeed; every classifier output must be literally 'true' or 'false'.
    name: gate
    if: always()
    needs: [changes, scans, links, rustfmt, clippy, x86-64-stub, engine-x86-workspace, fuzz-oxa, fuzz-oxe, build, gateway]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ['NEEDS'])
          bad = {k: v['result'] for k, v in needs.items() if v['result'] not in ('success', 'skipped')}
          for k in ('changes', 'scans'):                      # these two may never be skipped
              if needs[k]['result'] != 'success': bad[k] = needs[k]['result']
          flags = needs['changes'].get('outputs', {})
          for k in ('engine', 'oxa', 'gateway', 'docs', 'md', 'full'):
              if flags.get(k) not in ('true', 'false'): bad['changes.' + k] = repr(flags.get(k))
          print(json.dumps({k: v['result'] for k, v in needs.items()}, indent=1)); print('bad:', bad)
          sys.exit(1 if bad else 0)
          PY
