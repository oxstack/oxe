name: release
# Release binaries, built by GitHub's ARM64 runners from the tagged source (see the README,
# "Download"). A pushed tag v* builds, tests and packages oxe-server (MoE), oxe-server-flash, oxi
# and oxa (build.yml), writes SHA256SUMS, generates build provenance (actions/attest-build-provenance)
# and creates the GitHub Release with the tag's commit message as its notes.
# No secrets: the job token only. Only the release job holds write permissions and the
# "release" environment, which must be protected in the repository settings (required reviewer,
# deployment tags v*), together with a tag ruleset that limits who may create v* tags.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          v=$REF_NAME
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ $v =~ $re ]]; then echo "bad version string: $v" >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      package: true

  release:
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Protect this environment in the repository settings (see the header).
    environment: release
    permissions:
      contents: write      # create the release and upload its assets
      id-token: write      # sign the provenance (Sigstore)
      attestations: write  # store the attestation
    env:
      TAG: ${{ needs.version.outputs.version }}
    steps:
      - name: Refuse a release without provenance
        # Artifact attestations need a public repository on GitHub Free/Pro: a release without
        # one is not made from a private repository.
        if: github.event.repository.private
        run: |
          echo "::error::release only from the public repository (no build provenance in a private one)"
          exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          n=$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)
          test "$n" -ge 1
          # every product's tarball for this tag must be present
          for p in oxe-server oxe-server-flash oxi oxa; do
            test -f "./$p-$TAG-linux-aarch64.tar.gz" || { echo "missing tarball: $p"; exit 1; }
          done
          cat ./*.tar.gz.sha256 > SHA256SUMS
          rm ./*.tar.gz.sha256
          sha256sum -c SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq "$n"
          cat SHA256SUMS
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changelog=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.message)
          {
            echo "$changelog"
            echo
            echo "## Binaries"
            echo
            echo "Built by GitHub Actions from \`$TAG\` (commit $GITHUB_SHA) in [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID); nobody uploads binaries by hand."
            echo "Linux aarch64, for ARMv8.6-A cores with dotprod, i8mm, fp16 and bf16 (measured on Snapdragon X Elite X1E80100 only); glibc requirement and toolchain in each tarball's README.txt."
            echo "The CI builds pass the model-free tests and the Flash selftest; they have not been through the model-based identity or quality gates, and their outputs can differ from the measured builds in the last floating-point bits (README, \"Download\")."
            echo
            echo "| File | Contents |"
            echo "|---|---|"
            echo "| \`oxe-server-$TAG-linux-aarch64.tar.gz\` | \`oxe-server\`: the oxe MoE engine (Ornith 1.5, Qwen3.6 35B-A3B) |"
            echo "| \`oxe-server-flash-$TAG-linux-aarch64.tar.gz\` | \`oxe-server\` with the Flash engine (\`--engine flash\`) + \`flash-m0\` (expert sidecar) and \`flash-m3\` (selftest); ggml built in the same run from the pinned public sources |"
            echo "| \`oxi-$TAG-linux-aarch64.tar.gz\` | \`oxi\`: FLUX.2 klein image engine (experimental) |"
            echo "| \`oxa-$TAG-linux-aarch64.tar.gz\` | \`oxa\`: the coding agent (talks to the engine over its OpenAI-compatible API) |"
            echo
            echo "Verify:"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "gh attestation verify oxe-server-$TAG-linux-aarch64.tar.gz --repo $GITHUB_REPOSITORY \\"
            echo "  --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml"
            echo '```'
            echo
            echo "No model weights are included."
          } > notes.md
          opts=()
          case $TAG in *-*) opts+=(--prerelease);; esac
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "ox-llm $TAG" --notes-file notes.md "${opts[@]}"
