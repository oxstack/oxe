name: release-build
# Artifact-only qualification. No tags, schedules, credentials, or publication jobs.
on:
  workflow_call:
    inputs:
      version:
        description: release tag (SemVer, may carry +build metadata); recorded in the SBOM
        type: string
        default: ''
      file_version:
        description: version used in archive file names ('+' written as '.'); defaults to version
        type: string
        default: ''
      reproducible:
        description: build each architecture twice in different directories and compare the payloads
        type: boolean
        default: true
      skip_source_tests:
        description: skip packaging/release/check.sh because this commit's merge-queue run already passed it
        type: boolean
        default: false
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/release-build.yml'
      - 'packaging/**'
      - 'oxa/docs/pages/install.md'
      - 'docs/RELEASE.md'
      - 'oxa/oxa-cli/tests/no_python_in_path.rs'

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # Both empty by default and derived from oxa/Cargo.toml in each job; the file form is the tag
  # with '+' written as '.', which archive and package names need.
  VERSION: ${{ inputs.version }}
  FILE_VERSION: ${{ inputs.file_version }}
  CARGO_HOME: /opt/cargo
  RUSTUP_HOME: /opt/rustup
  CARGO_BUILD_JOBS: '2'

jobs:
  binaries:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: CPU artifacts (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e
    timeout-minutes: 180
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      source_epoch: ${{ steps.source.outputs.epoch }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Git before checkout (prevent REST archive fallback)
        run: dnf -y -q install --setopt=install_weak_deps=False git-core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version from the workspace when the caller gave none
        id: version
        run: |
          version=$(packaging/release/version.sh "$VERSION")
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
          if [ -z "$VERSION" ]; then
            echo "VERSION=$version" >> "$GITHUB_ENV"
          fi
          # '+' (build metadata) becomes '.' in archive and package file names.
          if [ -z "$FILE_VERSION" ]; then
            echo "FILE_VERSION=${version//+/.}" >> "$GITHUB_ENV"
          fi
          echo "version: $version"
      - name: GCC 16 and pinned Rust 1.99.1
        run: packaging/release/setup.sh
      - name: Immutable source archive
        id: source
        env:
          REPRODUCIBLE: ${{ inputs.reproducible }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          commit=$(git rev-parse HEAD)
          epoch=$(git show -s --format=%ct HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          # A dev push builds the tree once; the reproducibility lanes build it twice. An absent
          # input (the dispatch and pull-request triggers) keeps the strict form.
          builds="first second"
          if [ "$REPRODUCIBLE" = 'false' ]; then builds=first; fi
          echo "BUILDS=$builds" >> "$GITHUB_ENV"
          mkdir -p dist
          source_archive="dist/ox-llm-$commit.tar.gz"
          packaging/release/source-archive.sh "$source_archive"
          for build in $builds; do
            mkdir -p "/build/$build"
            tar -xzf "$source_archive" --strip-components=1 -C "/build/$build"
          done
      - name: Build once, or twice in different directories for the strict lanes
        env:
          REPRODUCIBLE: ${{ inputs.reproducible }}
        run: |
          for build in $BUILDS; do
            cd "/build/$build"
            packaging/release/build.sh
            packaging/release/stage.sh /build/payload
            packaging/release/archive.sh /build/payload "/build/$build.tar.gz"
            rm -rf /build/payload
          done
          arch=$(uname -m)
          cp /build/first.tar.gz "$GITHUB_WORKSPACE/dist/ox-llm-$FILE_VERSION-linux-$arch.tar.gz"
          if [ "$REPRODUCIBLE" = 'false' ]; then
            echo 'Single build for this dev push; the two-build comparison runs on the nightly and release lanes.' \
              > "$GITHUB_WORKSPACE/dist/REPRODUCIBILITY.txt"
          else
            cmp /build/first.tar.gz /build/second.tar.gz
            echo 'PASS: two clean builds in different source/target directories produced identical payload tarballs.' \
              > "$GITHUB_WORKSPACE/dist/REPRODUCIBILITY.txt"
          fi
          { rustc --version; cargo --version; cc --version; c++ --version; ld --version; rpm -q glibc libstdc++; } \
            > "$GITHUB_WORKSPACE/dist/TOOLCHAIN.txt"
      - name: No-Python proof on the exact release tarball binary
        working-directory: /build/first
        run: |
          set -euo pipefail
          source packaging/release/environment.sh
          artifact="$GITHUB_WORKSPACE/dist/ox-llm-$FILE_VERSION-linux-$(uname -m).tar.gz"
          extracted=$(mktemp -d)
          sandbox=$(mktemp -d)
          trap 'rm -rf "$extracted" "$sandbox"' EXIT
          tar -xzf "$artifact" -C "$extracted"
          test -x "$extracted/usr/bin/oxa"
          # Regression check for #2114: a dev build reports its full release version, not the
          # package version. VERSION is the same value the binaries were stamped with.
          want=${VERSION#v}
          [ "$(env -i "$extracted/usr/bin/oxa" --version)" = "oxa $want" ] \
            || { echo "oxa --version is not 'oxa $want'" >&2; exit 1; }
          [ "$(env -i "$extracted/usr/bin/oxe" --version)" = "oxe $want" ] \
            || { echo "oxe --version is not 'oxe $want'" >&2; exit 1; }
          case $(env -i "$extracted/usr/bin/oxe-server" --version) in
            *"$want"*) ;;
            *) echo "oxe-server --version does not contain '$want'" >&2; exit 1;;
          esac
          for legacy in usr/share/ox-llm/oxc usr/bin/oxc usr/bin/oxc-diagnostics; do
            test ! -e "$extracted/$legacy" && test ! -L "$extracted/$legacy" || exit 1
          done
          scan=$(packaging/release/no-python.sh "$artifact")
          receipt="$GITHUB_WORKSPACE/dist/NO-PYTHON-PROOF.txt"
          { printf 'source=%s\n' "$GITHUB_SHA"; sha256sum "$artifact" | cut -d' ' -f1;
            (cd "$extracted/usr/bin" && sha256sum oxa); printf '%s\n' "$scan"; } > "$receipt"
          cd oxa
          cargo fetch --locked
          env -i PATH="$PATH" HOME="$sandbox" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
            RUSTUP_TOOLCHAIN=1.99.1 CARGO_NET_OFFLINE=true CARGO_BUILD_JOBS="$CARGO_BUILD_JOBS" \
            RUSTFLAGS="$RUSTFLAGS" OXA_TEST_RELEASE_OXA="$extracted/usr/bin/oxa" \
            OXA_TEST_REQUIRE_RELEASE_ARTIFACT=1 \
            cargo test --profile ci --locked -p oxa-cli --test no_python_in_path \
            2>&1 | tee -a "$receipt"
      - name: Model-free source tests
        # A dev push whose commit already passed the merge queue skips the repeat
        # (tools/ci/queue_covered.py); release, nightly and pull-request runs always take it.
        if: ${{ !inputs.skip_source_tests }}
        working-directory: /build/first
        run: packaging/release/check.sh
      - name: CycloneDX SBOM and checksums
        run: |
          cd /build/first
          mkdir -p /build/payload
          tar -xzf "$GITHUB_WORKSPACE/dist/ox-llm-$FILE_VERSION-linux-$(uname -m).tar.gz" -C /build/payload
          packaging/release/sbom.sh /build/payload "$GITHUB_WORKSPACE/dist/SBOM.cdx.json"
          cp "$GITHUB_WORKSPACE/dist/SBOM.cdx.json" "$GITHUB_WORKSPACE/dist/ox-llm-$FILE_VERSION-linux-$(uname -m).sbom.cdx.json"
          # No build path or home directory in any shipped binary.
          for binary in /build/payload/usr/bin/*; do
            for prefix in /build/first /build/second "$HOME" /opt/cargo /opt/rustup; do
              ! grep -aqF -- "$prefix" "$binary" || { echo "build path $prefix in $binary" >&2; exit 1; }
            done
            ! LC_ALL=C grep -aqE '/home/[^/[:space:]]+/' "$binary" || { echo "home path in $binary" >&2; exit 1; }
          done
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum -- * > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  arch-source:
    # The source package compiles the archive in Arch and runs its check(); it needs no release
    # artifact, so it runs beside the release build instead of after it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Arch source package, namcap, clean install and removal
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No Python in installers, recipes and release scripts
        run: bash packaging/release/no-python-installers.sh
      - name: Immutable source archive and its checksum
        run: |
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "OX_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          packaging/release/source-archive.sh "source/ox-llm-$(git rev-parse HEAD).tar.gz"
          (cd source && sha256sum -- *.tar.gz > SHA256SUMS)
      - name: Fresh Arch container (official image is x86_64 only)
        run: |
          mkdir packages
          docker run --rm \
            -e SOURCE_DATE_EPOCH -e OX_SOURCE_COMMIT \
            -v "$GITHUB_WORKSPACE/source:/artifacts:ro" \
            -v "$GITHUB_WORKSPACE/packages:/packages" \
            -v "$GITHUB_WORKSPACE/packaging/arch:/recipes:ro" \
            -v "$GITHUB_WORKSPACE/packaging/release/smoke.sh:/smoke.sh:ro" \
            -v "$GITHUB_WORKSPACE/packaging/release/arch-test.sh:/arch-test.sh:ro" \
            -v "$GITHUB_WORKSPACE/packaging/release/no-python.sh:/no-python.sh:ro" \
            archlinux:latest bash /arch-test.sh source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-source-package-x86_64
          path: packages/
          if-no-files-found: error
          retention-days: 7

  arch-binary:
    name: Arch binary package, namcap, clean install and removal
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_DATE_EPOCH: ${{ needs.binaries.outputs.source_epoch }}
      # The binary tarball is stamped with the release version; smoke.sh expects it.
      SMOKE_VERSION: ${{ needs.binaries.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build-x86_64
          path: artifacts
      - name: Fresh Arch container (official image is x86_64 only)
        run: |
          mkdir packages
          docker run --rm \
            -e SOURCE_DATE_EPOCH -e SMOKE_VERSION \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts:ro" \
            -v "$GITHUB_WORKSPACE/packages:/packages" \
            -v "$GITHUB_WORKSPACE/packaging/arch:/recipes:ro" \
            -v "$GITHUB_WORKSPACE/packaging/release/smoke.sh:/smoke.sh:ro" \
            -v "$GITHUB_WORKSPACE/packaging/release/arch-test.sh:/arch-test.sh:ro" \
            -v "$GITHUB_WORKSPACE/packaging/release/no-python.sh:/no-python.sh:ro" \
            archlinux:latest bash /arch-test.sh binary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-packages-x86_64
          path: packages/
          if-no-files-found: error
          retention-days: 7

  portable-binary:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Portable Linux x86_64 oxa (glibc 2.31 floor)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version from the workspace when the caller gave none
        run: |
          version=$(packaging/release/version.sh "$VERSION")
          if [ -z "$VERSION" ]; then
            echo "VERSION=$version" >> "$GITHUB_ENV"
          fi
          # '+' (build metadata) becomes '.' in archive and package file names.
          if [ -z "$FILE_VERSION" ]; then
            echo "FILE_VERSION=${version//+/.}" >> "$GITHUB_ENV"
          fi
          echo "version: $version"
      # The debian:bullseye-slim container prepares itself inside the checked-out tree, so the
      # workflow installs nothing itself (`tools/ci/apt_install.sh` is the Ubuntu path and needs
      # sudo). See packaging/release/portable-bootstrap.sh.
      - name: Build against Debian 11 glibc and check the symbol floor
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -e VERSION \
            -v "$GITHUB_WORKSPACE:/w" -w /w \
            debian:bullseye-slim bash packaging/release/portable-bootstrap.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oxa-portable-linux-x86_64
          path: dist-portable/
          if-no-files-found: error
          retention-days: 7

  portable_binary_starts_in_three_images:
    name: portable_binary_starts_in_three_images
    needs: portable-binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version from the workspace when the caller gave none
        run: |
          version=$(packaging/release/version.sh "$VERSION")
          if [ -z "$VERSION" ]; then
            echo "VERSION=$version" >> "$GITHUB_ENV"
          fi
          # '+' (build metadata) becomes '.' in archive and package file names.
          if [ -z "$FILE_VERSION" ]; then
            echo "FILE_VERSION=${version//+/.}" >> "$GITHUB_ENV"
          fi
          echo "version: $version"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oxa-portable-linux-x86_64
          path: portable
      - name: oxa --version and one -p prompt in debian:bullseye-slim, ubuntu:22.04, python:3.12-slim
        run: |
          (cd portable && sha256sum -c oxa.sha256)
          chmod +x portable/oxa
          [ "$(env -i portable/oxa --version)" = "oxa ${VERSION#v}" ] \
            || { echo "portable oxa --version is not 'oxa ${VERSION#v}'" >&2; exit 1; }
          packaging/release/portable-smoke.sh portable
