name: build
# Reusable (workflow_call): build and test oxe-server, oxi, the Flash variant and oxa on GitHub's
# Linux ARM64 production runners and x86_64 test workers; optionally package the release tarballs as "dist-*" artifacts.
# Called by checks.yml (no packaging) and release.yml (packaging). No secrets, no model weights:
# every test here is model-free.
#
# Layout of the monorepo export: the engine is the cargo workspace in engine/, oxa is its own
# cargo workspace in oxa/. Toolchain: Fedora 44 container (GCC 16, the compiler the vendored ggml
# kernels were bit-matched with) + Rust from rustup at a pinned version (engine/tools/ci/setup_toolchain.sh).
# The binaries keep the production flags (Rust target-cpu=oryon-1 from engine/.cargo/config.toml,
# ggml -march=armv8.6-a+dotprod+i8mm+fp16+bf16+nosve+nosme); the tests run those binaries' code.
on:
  workflow_call:
    inputs:
      version:
        description: Version string in the tarball names (the tag, or dev-<sha>)
        type: string
        required: true
      package:
        description: Package tarballs and upload them as the "dist-*" artifacts
        type: boolean
        default: false
      heavy:
        description: Run engine builds and mandatory-sandbox workspace tests
        type: boolean
        default: true
      build_oxa:
        description: Run the oxa build (disabled only for draft PR checks)
        type: boolean
        default: true

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.1"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"

defaults:
  run:
    shell: bash   # bash -eo pipefail

jobs:
  engine:
    if: inputs.heavy
    name: oxe-server (MoE) + oxi
    runs-on: ubuntu-24.04-arm
    container:
      image: fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e
      # Docker's default seccomp profile blocks io_uring; the Flash IO tests use it.
      options: --security-opt seccomp=unconfined
    timeout-minutes: 150
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: tools/ci/setup_toolchain.sh "$RUST_VERSION"
      - name: Compiler and source cache key
        id: rust-key
        working-directory: ${{ github.workspace }}
        run: python3 -I tools/ci/rust_cache_key.py --variant fedora44-moe engine
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ steps.rust-key.outputs.key }}
          restore-keys: ${{ steps.rust-key.outputs.prefix }}
      - name: Mark sources newer than any restored build output
        # A restored target/ may hold workspace crates built from OLDER sources. Checkout mtimes can be older
        # than those artifacts, so cargo would treat stale crates as fresh. Touching the tracked sources
        # forces workspace crates to rebuild; third-party dependencies stay cached.
        working-directory: ${{ github.workspace }}
        run: find engine oxa -path '*/target' -prune -o -type f -exec touch -c {} +
      - name: Rust cache result
        run: echo "Rust cache exact hit = ${{ steps.rust-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build oxe-server and oxi
        run: cargo build --release --locked -p server -p image-flow --bin oxe-server --bin oxi
      - name: Smoke
        run: |
          ./target/release/oxe-server --help > help.txt && head -n 3 help.txt
          ./target/release/oxi > oxi.txt 2>&1 || true
          head -n 3 oxi.txt
      - name: Model-free tests (workspace without the Flash crate)
        timeout-minutes: 40
        # the numerics golden is recorded for the qualified reference platforms, not for this
        # hosted runner's kernel path: print its hash instead of failing
        env:
          OXE_NUMERICS_GOLDEN_UNLISTED: print
        run: |
          ulimit -c 0  # no core dumps from the deliberate-abort tests (tests::panic_child)
          cargo test --release --locked --no-fail-fast --workspace --exclude qwen4exp
      - name: Package
        if: inputs.package
        env:
          VERSION: ${{ inputs.version }}
          DIST: ${{ github.workspace }}/dist
        run: |
          tools/ci/package.sh oxe-server "$VERSION" "$DIST" server - target oxe-server
          tools/ci/package.sh oxi "$VERSION" "$DIST" image-flow - target oxi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.package
        with:
          name: dist-engine
          path: ${{ github.workspace }}/dist/
          if-no-files-found: error
          retention-days: 7

  flash:
    if: inputs.heavy
    name: oxe-server --features flash
    runs-on: ubuntu-24.04-arm
    container:
      image: fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e
      # Docker's default seccomp profile blocks io_uring; the Flash IO tests use it.
      options: --security-opt seccomp=unconfined
    timeout-minutes: 150
    defaults:
      run:
        working-directory: engine
    env:
      # the production ggml libraries, built below from the pinned public sources
      OXF_GGML_PROD: ${{ github.workspace }}/ggml-prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: tools/ci/setup_toolchain.sh "$RUST_VERSION"
      - name: Compiler and source cache key
        id: rust-key
        working-directory: ${{ github.workspace }}
        run: python3 -I tools/ci/rust_cache_key.py --variant fedora44-flash engine
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ steps.rust-key.outputs.key }}
          restore-keys: ${{ steps.rust-key.outputs.prefix }}
      - name: Mark sources newer than any restored build output
        # A restored target/ may hold workspace crates built from OLDER sources. Checkout mtimes can be older
        # than those artifacts, so cargo would treat stale crates as fresh. Touching the tracked sources
        # forces workspace crates to rebuild; third-party dependencies stay cached.
        working-directory: ${{ github.workspace }}
        run: find engine oxa -path '*/target' -prune -o -type f -exec touch -c {} +
      - name: Rust cache result
        run: echo "Rust cache exact hit = ${{ steps.rust-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Model-free Flash package licence fixtures (also without packaging)
        run: python3 -I tools/ci/test_flash_package.py
      - name: Production ggml from the pinned public sources
        run: tools/ci/build_ggml_prod.sh "$RUNNER_TEMP/flash-src"
      - name: Build oxe-server --features flash, flash-m0, flash-m3
        run: >-
          cargo build --release --locked -p server -p qwen4exp --features server/flash
          --bin oxe-server --bin flash-m0 --bin flash-m3
      - name: Smoke
        run: ./target/release/oxe-server --help > help.txt && head -n 3 help.txt
      - name: Model-free tests (Flash)
        timeout-minutes: 40
        run: |
          ulimit -c 0  # no core dumps from the deliberate-abort tests (tests::panic_child)
          cargo test --release --locked --no-fail-fast -p server --lib --features flash
          cargo test --release --locked --no-fail-fast -p qwen4exp
          ./target/release/flash-m3 selftest | tee selftest.txt
          ! grep -q FAIL selftest.txt
      - name: Package
        if: inputs.package
        env:
          VERSION: ${{ inputs.version }}
          DIST: ${{ github.workspace }}/dist
        run: tools/ci/package.sh oxe-server-flash "$VERSION" "$DIST" server flash target oxe-server flash-m0 flash-m3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.package
        with:
          name: dist-flash
          path: ${{ github.workspace }}/dist/
          if-no-files-found: error
          retention-days: 7

  oxa-test-build:
    if: inputs.heavy
    name: oxa test archive (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - name: Compiler and source cache key
        id: rust-key
        working-directory: ${{ github.workspace }}
        run: python3 -I tools/ci/rust_cache_key.py --variant ubuntu24-x86-oxa-ci oxa
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            oxa/target
          key: ${{ steps.rust-key.outputs.key }}
          restore-keys: ${{ steps.rust-key.outputs.prefix }}
      - name: Mark sources newer than any restored build output
        # A restored target/ may hold workspace crates built from OLDER sources. Checkout mtimes can be older
        # than those artifacts, so cargo would treat stale crates as fresh. Touching the tracked sources
        # forces workspace crates to rebuild; third-party dependencies stay cached.
        working-directory: ${{ github.workspace }}
        run: find engine oxa -path '*/target' -prune -o -type f -exec touch -c {} +
      - name: Rust cache result
        run: echo "Rust cache exact hit = ${{ steps.rust-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Pinned nextest
        run: tools/ci/install_nextest.sh "$RUNNER_TEMP/nextest"
      - name: Workspace doctests (isolated HOME/XDG)
        working-directory: oxa
        run: |
          real=$HOME; root=$(mktemp -d); log=$(mktemp)
          set +e
          env -i PATH="$PATH" CARGO_HOME="$real/.cargo" RUSTUP_HOME="$real/.rustup" RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" \
            HOME="$root" XDG_CONFIG_HOME="$root/c" XDG_STATE_HOME="$root/s" XDG_DATA_HOME="$root/d" \
            XDG_CACHE_HOME="$root/k" XDG_RUNTIME_DIR="$root/r" OXA_REQUIRE_BWRAP=1 \
            cargo test --profile ci --locked --workspace --doc --no-fail-fast -- --nocapture 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" = 0
          if grep -n '^skipped: ' "$log"; then echo "::error::doctest skipped at runtime"; exit 1; fi
      - name: Build child binaries and archive every workspace test once
        working-directory: oxa
        run: |
          cargo build --profile ci --locked -p oxa-cli -p oxa-fake
          cargo nextest archive --profile ci --cargo-profile ci --locked --workspace \
            --archive-file "$RUNNER_TEMP/oxa-tests.tar.zst"
          cargo nextest list --archive-file "$RUNNER_TEMP/oxa-tests.tar.zst" \
            --message-format json > "$RUNNER_TEMP/oxa-test-list.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oxa-test-archive-x86
          path: ${{ runner.temp }}/oxa-tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oxa-test-inventory
          path: ${{ runner.temp }}/oxa-test-list.json
          if-no-files-found: error
          retention-days: 1

  oxa-test-shards:
    if: inputs.heavy
    needs: oxa-test-build
    name: oxa tests shard ${{ matrix.shard }} (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bubblewrap + unprivileged user namespaces
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version
      - name: bwrap must work (else FAIL)
        run: |
          command -v bwrap || { echo "::error::bwrap is not installed"; exit 1; }
          bwrap --unshare-all --ro-bind / / true || { echo "::error::bwrap cannot create a sandbox on this runner"; exit 1; }
          echo "bwrap: --unshare-all OK"
      - name: Pinned nextest
        run: tools/ci/install_nextest.sh "$RUNNER_TEMP/nextest"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: oxa-test-archive-x86
          path: ${{ runner.temp }}/oxa-archive
      - name: Whole-workspace partition (isolated HOME/XDG; sandbox required)
        working-directory: oxa
        run: |
          ulimit -c 0
          root=$(mktemp -d)
          env -i PATH="$PATH" HOME="$root" XDG_CONFIG_HOME="$root/c" XDG_STATE_HOME="$root/s" \
            XDG_DATA_HOME="$root/d" XDG_CACHE_HOME="$root/k" XDG_RUNTIME_DIR="$root/r" \
            OXA_REQUIRE_BWRAP=1 \
            "$RUNNER_TEMP/nextest/cargo-nextest" nextest run --profile ci --no-tests fail \
            --archive-file "$RUNNER_TEMP/oxa-archive/oxa-tests.tar.zst" \
            --workspace-remap "$PWD" --extract-to "$PWD" \
            --partition hash:${{ matrix.shard }}/2 --test-threads 4 --success-output immediate \
            --failure-output immediate-final --no-output-indent
      - name: Preserve and validate the report even after failure
        if: always()
        run: |
          cp "oxa/target/nextest/ci/junit.xml" "$RUNNER_TEMP/junit-${{ matrix.shard }}.xml"
          python3 -I tools/ci/check_oxa_report.py "$RUNNER_TEMP/junit-${{ matrix.shard }}.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: oxa-test-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/junit-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 7

  oxa-tests:
    # Preserve the required check name. A missing/failed build or shard cannot turn green.
    if: always() && inputs.heavy
    needs: [oxa-test-build, oxa-test-shards]
    name: oxa tests (bwrap sandbox required)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every archive and partition must pass
        run: |
          test '${{ needs.oxa-test-build.result }}' = success
          test '${{ needs.oxa-test-shards.result }}' = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: oxa-test-inventory
          path: ${{ runner.temp }}/oxa-reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: oxa-test-report-*
          path: ${{ runner.temp }}/oxa-reports
          merge-multiple: true
      - name: All expected tests ran once; no runtime skips
        run: |
          python3 -I tools/ci/check_oxa_report.py --expected "$RUNNER_TEMP/oxa-reports/oxa-test-list.json" \
            "$RUNNER_TEMP/oxa-reports/junit-1.xml" "$RUNNER_TEMP/oxa-reports/junit-2.xml"

  oxa:
    if: inputs.build_oxa
    # oxa (the coding agent) is its own cargo workspace at oxa/. No model, no engine build: oxa
    # talks to the engine over HTTP only. Generic aarch64 code (no target-cpu flag).
    name: oxa
    runs-on: ubuntu-24.04-arm
    container:
      image: fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: engine/tools/ci/setup_toolchain.sh "$RUST_VERSION"
      - name: Compiler and source cache key
        id: rust-key
        working-directory: ${{ github.workspace }}
        run: python3 -I tools/ci/rust_cache_key.py --variant fedora44-oxa-release oxa
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            oxa/target
          key: ${{ steps.rust-key.outputs.key }}
          restore-keys: ${{ steps.rust-key.outputs.prefix }}
      - name: Mark sources newer than any restored build output
        # A restored target/ may hold workspace crates built from OLDER sources. Checkout mtimes can be older
        # than those artifacts, so cargo would treat stale crates as fresh. Touching the tracked sources
        # forces workspace crates to rebuild; third-party dependencies stay cached.
        working-directory: ${{ github.workspace }}
        run: find engine oxa -path '*/target' -prune -o -type f -exec touch -c {} +
      - name: Rust cache result
        run: echo "Rust cache exact hit = ${{ steps.rust-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build oxa
        working-directory: oxa
        run: cargo build --release --locked --bin oxa
      - name: WAVES.toml manifest
        working-directory: oxa
        run: python3 -I ci/check_manifest.py
      - name: Package
        if: inputs.package
        working-directory: oxa
        env:
          VERSION: ${{ inputs.version }}
          DIST: ${{ github.workspace }}/dist
        run: |
          stem="oxa-$VERSION-linux-aarch64"
          stage="$RUNNER_TEMP/pkg/$stem"
          mkdir -p "$stage/bin" "$stage/licenses" "$DIST"
          install -m 0755 target/release/oxa "$stage/bin/oxa"
          cp LICENSE NOTICE LICENSE-QuickJS.txt "$stage/"
          python3 -I ../engine/tools/ci/crate_licenses.py oxa-cli "$stage/licenses/crates"
          glibc=$(objdump -T "$stage/bin/oxa" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)
          {
            echo "oxa $VERSION for Linux on ARM64 (aarch64): the ox-llm coding agent"
            echo
            echo "Built by GitHub Actions from https://github.com/$GITHUB_REPOSITORY"
            echo "  source commit: $GITHUB_SHA"
            echo "  ref:           $GITHUB_REF_NAME"
            echo "  workflow run:  $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "  toolchain:     $(rustc --version)"
            echo
            echo "Binary (bin/):"
            (cd "$stage/bin" && sha256sum -- *)
            echo
            echo "OS: Linux aarch64 with glibc ${glibc#GLIBC_} or newer. Generic aarch64 code."
            echo "oxa talks to an OpenAI-compatible endpoint (the oxe engine); it contains no engine"
            echo "and no model weights."
            echo
            echo "Licences: LICENSE (MIT), NOTICE (pi attribution), licenses/crates (every Rust crate)."
          } > "$stage/README.txt"
          epoch=$(git log -1 --format=%ct 2>/dev/null || date +%s)
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$epoch" \
              -C "$(dirname "$stage")" -czf "$DIST/$stem.tar.gz" "$stem"
          (cd "$DIST" && sha256sum "$stem.tar.gz" > "$stem.tar.gz.sha256")
          cat "$DIST/$stem.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.package
        with:
          name: dist-oxa
          path: ${{ github.workspace }}/dist/
          if-no-files-found: error
          retention-days: 7
