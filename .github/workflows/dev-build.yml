name: dev-build
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dev-build
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  version:
    if: github.repository == 'oxstack/ox-llm'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: true
      - id: version
        run: |
          echo "version=$(python3 -I tools/ci/dev_version.py "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
  publish:
    needs: [version, build]
    if: github.repository == 'oxstack/ox-llm' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-build-*
          path: combined
      - name: Keep both qualified payloads and architecture-specific proof receipts
        run: |
          set -euo pipefail
          mkdir dist
          for arch in aarch64 x86_64; do
            source="combined/release-build-$arch"
            (cd "$source" && sha256sum -c SHA256SUMS)
            cp "$source/ox-llm-$VERSION-linux-$arch.tar.gz" "$source/ox-llm-$VERSION-linux-$arch.sbom.cdx.json" dist/
            for proof in REPRODUCIBILITY TOOLCHAIN NO-PYTHON-PROOF; do
              cp "$source/$proof.txt" "dist/ox-llm-$VERSION-linux-$arch.$proof.txt"
            done
          done
          # Every payload path is under usr/, and the native oxa is present.
          for tarball in dist/*.tar.gz; do
            tar -tzf "$tarball" | awk '!/^usr\// || /(^|\/)\.\.(\/|$)/ { print "unsafe payload path: " $0; bad = 1 } END { exit bad }'
            tar -tzf "$tarball" | grep -qx 'usr/bin/oxa' || { echo "missing native oxa in $tarball" >&2; exit 1; }
          done
          packaging/release/no-python.sh dist/*.tar.gz
          (cd dist && sha256sum -- * > SHA256SUMS && sha256sum -c SHA256SUMS)
          cp dist/SHA256SUMS "dist/SHA256SUMS-$VERSION"
      - name: Provenance for the exact dev assets and checksums
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Advance only the rolling dev prerelease
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "dist/ox-llm-$VERSION.provenance.jsonl"
          # Only a genuine 404 permits creation; auth/network failures fail closed.
          missing() { grep -q 'HTTP 404' "$1"; }
          # Publish only forward: this commit must still be on main and must be
          # newer than (or equal to) the commit the dev tag points at. Runs are
          # serialized by the concurrency group, so nothing races this check.
          on_main=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)
          case "$on_main" in ahead|identical) ;; *) echo "::notice::$GITHUB_SHA is not on main ($on_main); not publishing"; exit 0;; esac
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/dev" --jq .object.sha > dev-sha 2> dev-error; then
            forward=$(gh api "repos/$GITHUB_REPOSITORY/compare/$(cat dev-sha)...$GITHUB_SHA" --jq .status)
            case "$forward" in ahead|identical) ;; *) echo "::notice::dev already at a newer commit ($forward); not publishing"; exit 0;; esac
          else
            missing dev-error || { cat dev-error >&2; exit 1; }
          fi
          release="repos/$GITHUB_REPOSITORY/releases/tags/dev"
          if ! gh api "$release" > release.json 2> release-error; then
            missing release-error || { cat release-error >&2; exit 1; }
            gh release create dev --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title 'Development build'
          fi
          gh release upload dev dist/* --repo "$GITHUB_REPOSITORY" --clobber
          ref="repos/$GITHUB_REPOSITORY/git/refs/tags/dev"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/dev" > /dev/null 2> ref-error; then
            gh api --method PATCH "$ref" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            missing ref-error || { cat ref-error >&2; exit 1; }
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/dev -f sha="$GITHUB_SHA" > /dev/null
          fi
          printf 'Qualified main commit: %s\nVersion: %s\nRun: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > notes.md
          gh release edit dev --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft=false \
            --prerelease --latest=false --title "Development $VERSION" --notes-file notes.md
          # Publication is committed above. Remove superseded assets, never another tag/release.
          gh api "$release" --jq '.assets[].name' | while IFS= read -r asset; do
            test -f "dist/$asset" || gh release delete-asset dev --repo "$GITHUB_REPOSITORY" --yes -- "$asset"
          done
