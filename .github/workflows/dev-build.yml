name: dev-build
# Every push to main builds the dev tarball (release-build.yml) and advances the rolling `dev`
# prerelease, which has no stable assets and is never the "latest" release. A dev version is a
# pre-release of the next stable tag: vX.Y.(Z+1)-dev.<commits since tag>+<sha7>
# (tools/ci/dev_version.py). The tag `dev` always points at the commit of the newest published
# dev build. Build provenance is generated for the exact uploaded assets.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pushes stay serialized: a running build finishes, only the newest pending run is kept; the
  # publish step only ever moves the dev tag forward.
  group: dev-build-${{ github.event_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    if: github.repository == 'oxstack/oxe'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      file_version: ${{ steps.version.outputs.file_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - id: version
        run: |
          echo "version=$(python3 -I tools/ci/dev_version.py "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "file_version=$(python3 -I tools/ci/dev_version.py "$GITHUB_SHA" --file-name)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      file_version: ${{ needs.version.outputs.file_version }}

  publish:
    needs: [version, build]
    if: >-
      !cancelled() && needs.build.result == 'success' && github.repository == 'oxstack/oxe' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write      # create or update the rolling dev prerelease
      id-token: write      # sign the provenance (Sigstore)
      attestations: write  # store the attestation
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FILE_VERSION: ${{ needs.version.outputs.file_version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oxe-linux-aarch64
          path: dist
      - name: Build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Keep the attestation with the assets
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/oxe-$FILE_VERSION.provenance.jsonl"
      - name: Advance only the rolling dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only a genuine 404 permits creation; auth/network failures fail closed.
          missing() { grep -q 'HTTP 404' "$1"; }
          # Publish only forward: this commit must still be on main and must be newer than (or
          # equal to) the commit the dev tag points at. Runs are serialized by the concurrency
          # group, so nothing races this check.
          on_main=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)
          case "$on_main" in ahead|identical) ;; *) echo "::notice::$GITHUB_SHA is not on main ($on_main); not publishing"; exit 0;; esac
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/dev" --jq .object.sha > dev-sha 2> dev-error; then
            forward=$(gh api "repos/$GITHUB_REPOSITORY/compare/$(cat dev-sha)...$GITHUB_SHA" --jq .status)
            case "$forward" in ahead|identical) ;; *) echo "::notice::dev already at a newer commit ($forward); not publishing"; exit 0;; esac
          else
            missing dev-error || { cat dev-error >&2; exit 1; }
          fi
          release="repos/$GITHUB_REPOSITORY/releases/tags/dev"
          if ! gh api "$release" > release.json 2> release-error; then
            missing release-error || { cat release-error >&2; exit 1; }
            gh release create dev --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title 'Development build'
          fi
          gh release upload dev dist/* --repo "$GITHUB_REPOSITORY" --clobber
          ref="repos/$GITHUB_REPOSITORY/git/refs/tags/dev"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/dev" > /dev/null 2> ref-error; then
            gh api --method PATCH "$ref" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            missing ref-error || { cat ref-error >&2; exit 1; }
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/dev -f sha="$GITHUB_SHA" > /dev/null
          fi
          printf 'Qualified main commit: %s\nVersion: %s\nRun: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > notes.md
          gh release edit dev --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft=false \
            --prerelease --latest=false --title "Development $VERSION" --notes-file notes.md
          # Publication is committed above. Remove superseded assets, never another tag/release.
          gh api "$release" --jq '.assets[].name' | while IFS= read -r asset; do
            test -f "dist/$asset" || gh release delete-asset dev --repo "$GITHUB_REPOSITORY" --yes -- "$asset"
          done
