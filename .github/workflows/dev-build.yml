name: dev-build
on:
  push:
    branches: [main]
  schedule:
    # The two-build reproducibility comparison runs nightly and in the release lane, never on a
    # dev push.
    - cron: "43 4 * * *"
  workflow_dispatch:
    inputs:
      macos_stage_only:
        description: Build and upload the native macOS dev archive without publishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # The nightly qualification gets its own group so it never delays a dev push. Pushes stay
  # serialized: a running build finishes, only the newest pending push is kept.
  group: dev-build-${{ github.event_name }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  version:
    if: github.repository == 'oxstack/ox-llm'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      file_version: ${{ steps.version.outputs.file_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - id: version
        run: |
          echo "version=$(python3 -I tools/ci/dev_version.py "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "file_version=$(python3 -I tools/ci/dev_version.py "$GITHUB_SHA" --file-name)" >> "$GITHUB_OUTPUT"
  covered:
    # Same-SHA green evidence: a main push whose commit already passed the merge queue skips the
    # repeated model-free source tests (tools/ci/queue_covered.py decides; any doubt runs them).
    if: github.repository == 'oxstack/ox-llm' && !inputs.macos_stage_only
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      # Read-only: the merge-queue run lookup.
      actions: read
      contents: read
    outputs:
      covered: ${{ steps.covered.outputs.covered }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: covered
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: python3 -I tools/ci/queue_covered.py
  build:
    needs: [version, covered]
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      file_version: ${{ needs.version.outputs.file_version }}
      reproducible: ${{ github.event_name != 'push' }}
      skip_source_tests: ${{ needs.covered.outputs.covered == 'true' }}
  macos:
    if: github.event_name == 'push' || inputs.macos_stage_only
    # A failed main build never blocks Linux; an explicit qualification must pass.
    needs: version
    runs-on: macos-15
    continue-on-error: ${{ github.event_name == 'push' }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '3'
      RUST_VERSION: '1.99.1'
      FILE_VERSION: ${{ needs.version.outputs.file_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Isolated environment and toolchain
        run: |
          test "$(uname -m)" = arm64
          root=$(mktemp -d "$RUNNER_TEMP/oxa-macos.XXXXXX")
          root=$(cd "$root" && pwd -P)
          mkdir -p "$root/home" "$root/cargo" "$root/rustup" "$root/tmp"
          export HOME="$root/home" CARGO_HOME="$root/cargo" RUSTUP_HOME="$root/rustup" TMPDIR="$root/tmp"
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          for name in HOME CARGO_HOME RUSTUP_HOME TMPDIR; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
          echo "$RUSTUP_HOME/toolchains/$RUST_VERSION-aarch64-apple-darwin/bin" >> "$GITHUB_PATH"
      - name: Build oxa
        working-directory: oxa
        run: cargo build --release --locked -p oxa-cli --bin oxa
      - name: Stage the archive
        id: stage
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/macos-dist"
          archive=$(bash packaging/macos/stage.sh "$FILE_VERSION" oxa/target/release/oxa "$out")
          test "$archive" = "$out/ox-llm-$FILE_VERSION-macos-arm64.tar.gz"
          probe=$(mktemp -d "$RUNNER_TEMP/probe.XXXXXX")
          tar -xzf "$archive" -C "$probe"
          cmp oxa/target/release/oxa "$probe/usr/bin/oxa"
          test "$(lipo -archs "$probe/usr/bin/oxa")" = arm64
          "$probe/usr/bin/oxa" --version
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dist-arm64
          path: ${{ steps.stage.outputs.archive }}
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [version, build, macos]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.repository == 'oxstack/ox-llm' && github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FILE_VERSION: ${{ needs.version.outputs.file_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-build-*
          path: combined
      # Optional: a failed macOS build leaves no artifact and the Linux release still publishes.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: macos-dist-arm64
          path: macos-dist
      - name: Assemble and verify the dev assets
        run: bash packaging/release/dev-dist.sh "$FILE_VERSION"
      - name: Provenance for the exact dev assets and checksums
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Advance only the rolling dev prerelease
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "dist/ox-llm-$FILE_VERSION.provenance.jsonl"
          # Only a genuine 404 permits creation; auth/network failures fail closed.
          missing() { grep -q 'HTTP 404' "$1"; }
          # Publish only forward: this commit must still be on main and must be
          # newer than (or equal to) the commit the dev tag points at. Runs are
          # serialized by the concurrency group, so nothing races this check.
          on_main=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)
          case "$on_main" in ahead|identical) ;; *) echo "::notice::$GITHUB_SHA is not on main ($on_main); not publishing"; exit 0;; esac
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/dev" --jq .object.sha > dev-sha 2> dev-error; then
            forward=$(gh api "repos/$GITHUB_REPOSITORY/compare/$(cat dev-sha)...$GITHUB_SHA" --jq .status)
            case "$forward" in ahead|identical) ;; *) echo "::notice::dev already at a newer commit ($forward); not publishing"; exit 0;; esac
          else
            missing dev-error || { cat dev-error >&2; exit 1; }
          fi
          release="repos/$GITHUB_REPOSITORY/releases/tags/dev"
          if ! gh api "$release" > release.json 2> release-error; then
            missing release-error || { cat release-error >&2; exit 1; }
            gh release create dev --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title 'Development build'
          fi
          gh release upload dev dist/* --repo "$GITHUB_REPOSITORY" --clobber
          ref="repos/$GITHUB_REPOSITORY/git/refs/tags/dev"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/dev" > /dev/null 2> ref-error; then
            gh api --method PATCH "$ref" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            missing ref-error || { cat ref-error >&2; exit 1; }
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/dev -f sha="$GITHUB_SHA" > /dev/null
          fi
          printf 'Qualified main commit: %s\nVersion: %s\nRun: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > notes.md
          gh release edit dev --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft=false \
            --prerelease --latest=false --title "Development $VERSION" --notes-file notes.md
          # Publication is committed above. Remove superseded assets, never another tag/release.
          gh api "$release" --jq '.assets[].name' | while IFS= read -r asset; do
            test -f "dist/$asset" || gh release delete-asset dev --repo "$GITHUB_REPOSITORY" --yes -- "$asset"
          done
