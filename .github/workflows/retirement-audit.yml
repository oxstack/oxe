name: retirement audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/retirement-audit.yml'
      - 'tools/ci/rust_retirement_audit.py'

permissions:
  contents: read

concurrency:
  group: retirement-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Source-only inventory and dependency candidates
        shell: bash
        run: |
          set -euo pipefail
          audit_root="$HOME/.cache/ox-llm-retirement-audit"
          mkdir -p "$audit_root"/{artifacts,cargo,target}
          export CARGO_HOME="$audit_root/cargo" CARGO_TARGET_DIR="$audit_root/target"
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          rustup run 1.99.1 cargo install --locked cargo-machete --version 0.9.1 --root "$audit_root/tools"
          export PATH="$audit_root/tools/bin:$PATH" RUSTUP_TOOLCHAIN=1.99.1
          python3 -I tools/ci/rust_retirement_audit.py "$audit_root/artifacts"
          git diff --exit-code
          echo 'Inventory only: no product build, engine execution or automatic removal.'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rust-retirement-audit
          path: ~/.cache/ox-llm-retirement-audit/artifacts
          if-no-files-found: error
          retention-days: 7
