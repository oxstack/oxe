name: oxa macOS
# Native arm64 build of the oxa-cli binary (#795). On pull requests and in the merge queue it is
# required: checks.yml calls this workflow as its `macos` job (when the classifier says oxa changed)
# and the `gate` aggregate fails if it fails. Standalone it runs on manual dispatch only: a push to
# main of the commit the queue tested would be a second build of the same tree (#2049), so there is
# no push trigger. It has no pull_request trigger of its own either, so a PR never runs it twice.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: release tag requested by the calling workflow; empty for pull requests and the merge queue
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

jobs:
  test:
    name: oxa-cli build (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '3'
      RUST_VERSION: '1.99.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Isolated environment and toolchain
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          # HOME, cargo, rustup and temp dirs live under the runner temp dir, never inside the
          # checkout: KeyFile::prepare refuses any path with a .git ancestor. Resolve symlinks
          # (macOS /var is /private/var) so canonical paths match the real ones.
          root=$(mktemp -d "$RUNNER_TEMP/oxa-macos.XXXXXX")
          root=$(cd "$root" && pwd -P)
          mkdir -p "$root/home" "$root/cargo" "$root/rustup" "$root/tmp"
          export HOME="$root/home" CARGO_HOME="$root/cargo" RUSTUP_HOME="$root/rustup" TMPDIR="$root/tmp"
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          for name in HOME CARGO_HOME RUSTUP_HOME TMPDIR; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
          echo "$RUSTUP_HOME/toolchains/$RUST_VERSION-aarch64-apple-darwin/bin" >> "$GITHUB_PATH"
      - name: Build oxa-cli binary
        working-directory: oxa
        run: cargo build --profile ci --locked -p oxa-cli --bin oxa
      - name: Check binary exists
        working-directory: oxa
        shell: bash
        run: |
          test -x target/ci/oxa
          file target/ci/oxa
