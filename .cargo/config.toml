[build]
jobs = 1
# Oryon code generation on aarch64 only (O-174: an x86_64 build is the stub-engine server for CI;
# the aarch64 flags are exactly the ones [build] carried before, so aarch64 output is unchanged)
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=oryon-1"]
[env]
RUST_TEST_THREADS = "1"
