[package]
name = "oxe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "oxe command-line tool: oxe (gen/trace/compare/verify/bench/cache)"
build = "build.rs"

[features]
f32-reference = ["model/f32-reference"]
npu-prefill = ["model/npu-prefill", "dep:oxn"]
npu-device = ["npu-prefill", "model/npu-device", "oxn/device"]

[dependencies]
gguf = { path = "../gguf" }
kernels-sys = { path = "../kernels-sys" }
sched = { path = "../sched" }
model = { path = "../model" }
tokenizer = { path = "../tokenizer" }
serde_json.workspace = true
oxn = { path = "../oxn", optional = true }
oxe-supervisor = { path = "../supervisor" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "signal"] }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1.12.1"
toml_edit = "0.25"
ureq.workspace = true

[[bin]]
name = "oxe"
path = "src/bin/oxe.rs"

[dev-dependencies]
model = { path = "../model", features = ["testkit"] }
# The serve tests end `oxe serve` with real signals (SIGTERM and SIGKILL), like an operator would.
nix = { version = "0.30", features = ["signal", "process"] }
