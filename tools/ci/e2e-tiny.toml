# Budgets and settings of the end-to-end job (.github/workflows/e2e.yml, tools/ci/e2e_tiny.py).
# One place for every number. Owner rule: a limit warns (a GitHub warning annotation and a line in the
# report); only the generous hard ceilings fail the job. They exist to catch a hang, not a slowdown.

[model]
# sha256 of Qwen3.5-0.8B-Q8_0.gguf (unsloth/Qwen3.5-0.8B-GGUF, the revision pinned in e2e.yml). A
# mismatch fails the job: the model changed without this pin changing.
sha256 = "0ad885ffd4bb022fc4f0d33a3308fa108ef8613159d3b3a67e23abca056b7a6c"

[server]
port = 18080
ctx_size = 65536
startup_timeout_s = 120

[probe]
# Direct streaming request to oxe-server, run twice: the cold and the warm time to first token.
prompt_repeat = 300
max_tokens = 8

[oxa]
# `oxa -p`, two runs in one session (the second continues the first).
run_timeout_s = 240
max_time_s = 180
# stops a run after this many new prompt+output tokens (cached ones are free)
max_tokens = 20000
# error classes a run may end on and still count (none: the real model stops by itself)
accept_error_classes = []
# the tool task: the first run must leave `task_file` in the work directory holding `task_word`
# "in the current directory": the 0.8B model otherwise picks /hello.txt (first real run)
first_prompt = "Create a file named hello.txt in the current directory containing the word hi."
task_file = "hello.txt"
task_word = "hi"
# answered from the conversation: bash is off in the container (no usable bwrap), and a tool call
# here sent the 0.8B model into a retry loop until --max-time (first real run)
second_prompt = "Without using any tool, answer in one sentence: which file did you just create?"

[budget]
# warn above *_warn_ms; fail only above *_fail_ms.
ttft_cold_warn_ms = 3000
ttft_cold_fail_ms = 60000
ttft_warm_warn_ms = 1500
ttft_warm_fail_ms = 60000
turn_warn_ms = 60000
turn_fail_ms = 180000
warm_over_cold_prefill_warn = 0.5
warm_over_cold_prefill_fail = 1.0

[cache]
# Reuse ratio = cached prompt tokens / the previous prompt's tokens (a new turn adds only its own
# tokens, so a healthy cache reuses nearly all of it). Fail below the floor.
min_reuse_ratio = 0.9
# Per-model baseline (the ratio measured on main for that model file). A drop of more than 10 points
# fails, a smaller drop warns. Fill in from the first green run's report.
baseline_fail_drop = 0.10
baseline_warn_drop = 0.01

[cache.baseline]
# Qwen3.5-0.8B-Q8_0.gguf: fill in from the first green run of the real model on main
